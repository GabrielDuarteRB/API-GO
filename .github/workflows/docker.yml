name: Docker

on:
  pull_request:
    branches:
      - develop
  workflow_dispatch:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - develop

permissions:
  contents: read

env:
  IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  docker_lint:
    name: Docker Lint
    runs-on: ubuntu-latest
    if: >-
      ${{
        github.event_name != 'workflow_run' ||
        (
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.conclusion == 'success'
        )
      }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Lint Dockerfile with Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

  docker_build:
    name: Build Docker
    runs-on: ubuntu-latest
    if: >-
      ${{
        github.event_name != 'workflow_run' ||
        (
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.conclusion == 'success'
        )
      }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Build Docker
        run: docker build --tag "api-go:${IMAGE_TAG}" .

      - name: Save image
        run: docker save --output /tmp/api-go-image.tar "api-go:${IMAGE_TAG}"

      - name: Artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/api-go-image.tar
          if-no-files-found: error
          retention-days: 1

  trivy_scan:
    name: Trivy
    runs-on: ubuntu-latest
    needs:
      - docker_build
    if: >-
      ${{
        github.event_name != 'workflow_run' ||
        (
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.conclusion == 'success'
        )
      }}
    steps:
      - name: Artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/docker-image

      - name: Load Docker
        run: docker load --input /tmp/docker-image/api-go-image.tar

      - name: Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: api-go:${{ env.IMAGE_TAG }}
          format: table
          exit-code: '0'

  docker_push:
    name: Push Docker Hub
    runs-on: ubuntu-latest
    needs:
      - docker_lint
      - docker_build
      - trivy_scan
    steps:
      - name: Artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/docker-image

      - name: Load Docker
        run: docker load --input /tmp/docker-image/api-go-image.tar

      - name: Login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push
        env:
          IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/api-go
        run: |
          docker tag "api-go:${IMAGE_TAG}" "${IMAGE_NAME}:develop"
          docker tag "api-go:${IMAGE_TAG}" "${IMAGE_NAME}:${IMAGE_TAG}"
          docker push "${IMAGE_NAME}:develop"
          docker push "${IMAGE_NAME}:${IMAGE_TAG}"
